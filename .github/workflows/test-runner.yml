name: Test Runner
run-name: "Test Runner `${{ github.ref_name || github.head_ref }}`"

on: push

env:
  BUILD_TYPE: Debug
  CMAKE_BUILD_DIRECTORY: build
  CPM_CACHE_DIR: .cpm-cache
  GH_TOKEN: ${{ github.token }}
  SCCACHE_CACHE_MULTIARCH: 1
  SCCACHE_GHA_ENABLED: true

defaults:
  run:
    shell: bash

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
        juce: [7.0.12, 8.0.15, master, develop]
        include:
          - platform: macos-latest
            platform-name: macOS
            package-manager: brew
            additional-cmake-options: -DJIVE_ENABLE_COVERAGE=ON -DJIVE_ENABLE_SANITISERS=ON

          - platform: windows-latest
            platform-name: Windows
            platform-shell: cmd
            package-manager: choco

          - juce: master
            upload-coverage: true

          - juce: 7.0.12
            platform: macos-latest
            macos-deployment-target: "14.0"
            juce-cmake-options: >-
              -D CMAKE_OSX_DEPLOYMENT_TARGET=14.0
              -D "CMAKE_CXX_FLAGS=-Wno-error=unused-but-set-variable -Wno-error=switch-enum -Wno-error=main"

    name: Test ${{ matrix.platform-name }} (JUCE ${{ matrix.juce }})
    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Checkout JUCE
        uses: actions/checkout@v6
        with:
          repository: juce-framework/JUCE
          ref: ${{ matrix.juce }}
          path: juce

      - name: Install Ninja
        run: ${{ matrix.package-manager }} install ninja
      - name: Setup devcmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Restore CPM dependencies
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CPM_CACHE_DIR }}
          key: cpm-${{ runner.os }}-${{ matrix.juce }}-${{ github.ref_name || github.head_ref }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.juce }}-${{ github.ref_name || github.head_ref }}-${{ github.run_number }}
            cpm-${{ runner.os }}-${{ matrix.juce }}-${{ github.ref_name || github.head_ref }}
            cpm-${{ runner.os }}-${{ matrix.juce }}-main
            cpm-${{ runner.os }}-${{ matrix.juce }}

      - name: CMake Generate
        run: |
          cmake \
            -B ${{ env.CMAKE_BUILD_DIRECTORY }} \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -D JIVE_BUILD_TEST_RUNNER=ON \
            -D CMAKE_C_COMPILER_LAUNCHER=sccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -D CPM_SOURCE_CACHE=${{ env.CPM_CACHE_DIR }} \
            -D CMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            -D CPM_JUCE_SOURCE="${GITHUB_WORKSPACE//\\//}/juce" \
            ${{ matrix.additional-cmake-options }} \
            ${{ matrix.juce-cmake-options }}

      - name: Cache CPM dependencies
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CPM_CACHE_DIR }}
          key: cpm-${{ runner.os }}-${{ matrix.juce }}-${{ github.ref_name || github.head_ref }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: CMake Build
        run: |
          cmake \
            --build ${{ env.CMAKE_BUILD_DIRECTORY }} \
            --config ${{ env.BUILD_TYPE }}

      - name: Run CTest
        run: |
          cd ${{ env.CMAKE_BUILD_DIRECTORY }}
          ctest \
            --output-on-failure \
            --extra-verbose \
            -C ${{ env.BUILD_TYPE }} \
            -T test \
            -O ctest.log

      - name: Install lcov
        if: runner.os == 'macOS' && matrix.upload-coverage
        working-directory: ${{github.workspace}}/build
        run: brew install lcov

      - name: Generate Coverage Report
        if: runner.os == 'macOS' && matrix.upload-coverage
        working-directory: ${{github.workspace}}/build
        run: |
          lcov \
            --directory . \
            --capture \
            --output-file coverage.info \
            --ignore-errors inconsistent \
            --ignore-errors gcov \
            --ignore-errors range \
            --ignore-errors source \
            --ignore-errors format

      - name: Upload Coverage Report
        if: runner.os == 'macOS' && matrix.upload-coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./build/coverage.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Stage Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: "${{ matrix.platform-name }} JUCE ${{ matrix.juce }} #${{ github.event.pull_request.number }}"
          path: ${{ env.CMAKE_BUILD_DIRECTORY }}/ctest.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  verify-formatting:
    name: Verify Formatting
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: brew install clang-format

      - name: Verify formatting
        run: python3 .github/scripts/verify_formatting.py
